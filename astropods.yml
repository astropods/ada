# yaml-language-server: $schema=https://astropods.ai/schema/package.json
spec: package/v1
name: ada

agent:
  build:
    context: .
    dockerfile: Dockerfile
  interfaces:
    # Serves the built-in AG-UI client + the SSE/HTTP API publicly from the
    # container's port 80. Any AG-UI client (CopilotKit, custom) can also point
    # at {ASTRO_EXTERNAL_AGENT_URL}/sessions/... directly.
    frontend: true
    # Also deploy the platform's messaging sidecar (chat UI / Slack). The sidecar
    # runs the channel adapters, normalizes every inbound message to one shape,
    # and streams it to us over gRPC (GRPC_SERVER_ADDR). agent/messaging/adapter.ts
    # + adapter-core `serve()` handle our side, so a Slack thread becomes one
    # durable Flue agent instance (thread id == instance id). Slack itself is
    # platform-managed (its app + workspace linking + user identity live in
    # astro-server) — this agent needs NO Slack tokens. frontend + messaging
    # coexist: our UI on its hostname, Slack/web on the sidecar's routes.
    messaging: true


# Route model calls through the Astro AI Gateway instead of a personal key.
# Injects ASTRO_GATEWAY_URL + ASTRO_GATEWAY_API_KEY (virtual key). config/model.ts
# maps these to the gateway's /anthropic endpoint (→ Bedrock). Opt out per-deploy
# by setting the optional ANTHROPIC_API_KEY input below — that bypasses the
# gateway and calls Anthropic directly.
models:
  default:
    provider: gateway

inputs:
  # GitHub App provisioning is web-driven. List the email addresses allowed to
  # set it up (comma-separated). An admin opens the web UI and clicks "Set up
  # GitHub App", which walks GitHub's App-Manifest flow — creating a correctly-
  # configured GitHub App (callback, permissions) in a couple clicks and storing
  # its OAuth credentials in the DB. No manual App registration, no client
  # id/secret to copy. Regular users then connect their own GitHub with
  # `/connect-github` in chat. Leave unset and any signed-in user may perform the
  # INITIAL setup (once the App is configured, provisioning locks so no one can
  # overwrite it — set this to re-enable admin re-provisioning). Emails are matched
  # (case-insensitively) against the ALB-verified identity, so setup is web-only.
  ADMIN_EMAILS:
    name: ADMIN_EMAILS
    datatype: string
    optional: true
    description: "Optional: comma-separated admin emails allowed to set up the GitHub App (matched against the verified login email). Unset = any signed-in user can do the initial setup."
    display-as: short-text
  # Optional opt-out of the Astro AI Gateway (see astro_ai_gateway above). Provide
  # your own Anthropic API key and model calls go DIRECTLY to api.anthropic.com
  # with it, bypassing the gateway/Bedrock. Leave unset to use the gateway
  # (default). In config/model.ts a set ANTHROPIC_API_KEY takes precedence over
  # the injected ASTRO_GATEWAY_* and selects the built-in `anthropic` pi-ai
  # provider instead of the custom gateway provider.
  ANTHROPIC_API_KEY:
    name: ANTHROPIC_API_KEY
    datatype: string
    secret: true
    optional: true
    description: "Optional: use this Anthropic API key directly and bypass the Astro AI Gateway"
    display-as: short-text
  # Max concurrent agent runs. A run holds a sandbox and spawns real build/test
  # commands in it (CPU+memory); both browser and messaging turns route through
  # this limiter, so LOWERING it (e.g. 1–2) eases memory pressure when the
  # container can't be sized up. Default 3.
  #
  # It is not the only lever, and no longer the first one to reach for. This
  # bounds RUNS, but one run issues many tool calls and a reviewer delegate
  # issues its own, so the sandbox container has its own limits that act closer
  # to where the memory is actually spent — SANDBOX_MAX_CONCURRENT_EXEC bounds
  # simultaneous commands, the head/tail capture windows bound retained output,
  # and the worker-pool caps in sandbox/Dockerfile stop a build fanning out to
  # the host's core count under a fractional CPU quota. See sandbox/index.ts.
  MAX_CONCURRENT_RUNS:
    name: MAX_CONCURRENT_RUNS
    datatype: number
    optional: true
    default: "3"
    description: "Max concurrent agent runs. Lower to 1–2 to ease container memory pressure."
    display-as: short-text
  # Independent code review. When on, a substantive change triggers a delegate
  # (the `code-reviewer` subagent) that re-reads the diff with fresh context and
  # no attachment to the approach taken — critical/high findings are fixed before
  # the turn finishes, the rest are reported. Costs one extra model pass over the
  # diff, so it is skipped for docs-only and sub-20-line changes
  # (ADA_REVIEW_MIN_LINES tunes the threshold).
  #
  # This is only the DEFAULT. Either side can flip it mid-conversation — ask Ada
  # to turn review off and it calls `set_review_mode`, which is durable for that
  # conversation and actually unmounts the delegate on the next render.
  ADA_REVIEWER_ENABLED:
    name: ADA_REVIEWER_ENABLED
    datatype: string
    optional: true
    default: "true"
    description: "Run an independent code-reviewer pass on substantive changes. Can be toggled per conversation by asking Ada."
    display-as: select
    options: ["true", "false"]
  # WHICH SANDBOX runs the model's commands. `auto` keeps the behaviour every
  # deployment had before there was a choice: the platform container when one is
  # injected, in-process otherwise. `astro` moves to a platform MicroVM per
  # conversation — opt-in while it is proven, and reversible by setting this
  # back, with no redeploy of code.
  #
  # `local` runs commands IN THE CONTROL PLANE, which holds the database
  # credentials, the GitHub App secret and the HMAC signing key. It is here
  # because forcing it is occasionally useful in development, not because it is
  # a deployment option. Neither remote mode falls back to it: a misconfigured
  # `astro` or `container` fails the turn instead of quietly switching the
  # isolation boundary off.
  ADA_SANDBOX:
    name: ADA_SANDBOX
    datatype: string
    optional: true
    default: "auto"
    description: "Where the model's commands run. auto = as injected (container, else in-process); astro = a platform MicroVM per conversation; local = in-process, NOT isolated."
    display-as: select
    options: ["auto", "astro", "container", "local"]
  # GitHub App visibility. Default PRIVATE (single-tenant): only the account that
  # created the App can install it — right when one user/org runs their own Ada.
  # Set "true" for MULTI-TENANT: a PUBLIC App any teammate can install on THEIR
  # repos and connect via chat. Public only means "installable by others"; each
  # install is still explicit + repo-scoped, and the client secret stays secret.
  GITHUB_APP_PUBLIC:
    name: GITHUB_APP_PUBLIC
    datatype: string
    optional: true
    default: "false"
    description: "Provision the GitHub App as public (multi-tenant: installable by other users). Default false = private/single-tenant."
    display-as: select
    options: ["false", "true"]

# Platform-managed execution sandbox — one Lambda MicroVM per conversation.
#
# Declaring this section is the whole switch: the platform installs the
# declaration, `ast` injects a dev-session token locally, and the agent attaches
# by name through the control plane. There is no per-account flag and no local
# sandbox runtime — a local run attaches a REAL MicroVM, so `ast` must be logged
# in for sandbox paths to work off a deployment.
#
# This replaces `knowledge.sandbox` (the bespoke container in sandbox/), which
# stays declared below until the new driver is proven. Both can coexist: Ada
# picks the container while KNOWLEDGE_SANDBOX_HOST is injected.
#
# WHAT THE BASE IMAGE ALREADY HAS, so it is absent here: git, git-lfs, jq, tar,
# gzip, xz, unzip, zip, patch, diffutils, findutils, rsync, openssh-clients,
# less, procps-ng, sudo, curl-minimal, and coreutils/grep/sed/awk. No language
# runtime and no compiler — those are exactly what a declaration is for.
sandbox:
  # `auto` rather than `always`: the build toolchain is 60 packages whose
  # closure drags in systemd, for 8 seconds of install time saved. `auto`
  # installs it only when something declared here actually needs to compile.
  toolchain: auto

  # Node runs the agent's own tooling; bun is what sandbox/Dockerfile shipped
  # and what this project's own checks use. Global npm packages land under
  # /opt/astropods, which is the environment the platform caches per
  # declaration and restores into any sandbox — not the per-conversation
  # workspace.
  node:
    version: "24"
    packages: ["bun@1.3.9"]

  env:
    # Never let git stop for a credential prompt; there is no terminal.
    GIT_TERMINAL_PROMPT: "0"
    # SIZED TO THE MICROVM: 2048 MiB and one vCPU (arm64). The VM is one
    # compute unit at the platform's 2 GiB-per-vCPU ratio, so the two halves of
    # this block are tuned in OPPOSITE directions from the container's numbers.
    #
    # MEMORY GOES UP. The container was fitted to a ~600 MiB budget (see
    # `fix(sandbox): fit the execution container's fixed memory budget`) and
    # that budget is the thing that made builds fall over. 2 GiB is ~3.4x it,
    # so keeping 384 MB of Node heap would waste most of the VM and reproduce
    # the same failure. The heap cap stays under half of RAM rather than
    # tracking it: a sandbox may hold more than one process, and this is a hard
    # per-process ceiling, whereas GOMEMLIMIT is a soft limit that only brings
    # GC forward and can sit higher safely.
    GOMEMLIMIT: "1536MiB"
    NODE_OPTIONS: "--max-old-space-size=1024"
    # CONCURRENCY STAYS AT ONE, and is now right for a better reason. These
    # were memory rationing on the container; on a one-vCPU VM they simply
    # match the hardware, so there is nothing to reclaim by raising them.
    GOMAXPROCS: "1"
    UV_THREADPOOL_SIZE: "2"
    MAKEFLAGS: "-j1"
    JOBS: "1"
    npm_config_jobs: "1"
    CARGO_BUILD_JOBS: "1"
    VITEST_MAX_THREADS: "1"
    VITEST_MIN_THREADS: "1"
    VITEST_MAX_FORKS: "1"
    NX_PARALLEL: "1"
    TURBO_CONCURRENCY: "1"
    PYTHONDONTWRITEBYTECODE: "1"
    # DELIBERATELY NOT SET: npm_config_cache, BUN_INSTALL_CACHE_DIR,
    # GOMODCACHE, GOCACHE, PIP_CACHE_DIR, WORKSPACE_ROOT. The container pointed
    # all of them at its /data volume. The base image already points them into
    # /opt/astropods, and redirecting them at the workspace would put a package
    # store in the one place that is per-sandbox rather than per-declaration.

  setup:
    # `gh` is not in the AL2023 package repository, so it arrives as a release
    # tarball. Pinned, and arm64 because sandboxes run only on Graviton 3/4.
    # gh is a static Go binary, so the image's glibc 2.34 does not constrain it
    # — a check that DOES apply to anything else fetched this way.
    #
    # Installed into /opt/astropods/bin: already on PATH, and part of the
    # environment rather than the workspace. Guarded by `command -v` so it is
    # a no-op whether setup re-runs per sandbox or the environment is restored.
    - >-
      command -v gh >/dev/null || {
      curl -fsSL https://github.com/cli/cli/releases/download/v2.101.0/gh_2.101.0_linux_arm64.tar.gz
      | tar xz -C /tmp &&
      install -m 0755 /tmp/gh_2.101.0_linux_arm64/bin/gh /opt/astropods/bin/gh; }
    # How Ada's git reaches a private repo: the per-command GH_TOKEN the control
    # plane sends is read by `gh auth git-credential`, so no credential is ever
    # written to disk here. Idempotent — git config overwrites the key.
    - git config --system credential."https://github.com".helper "!gh auth git-credential"

knowledge:
  # Platform-managed Postgres, injecting POSTGRES_HOST/PORT/USER/PASSWORD/DB.
  # Two consumers share it:
  #   - Ada's own Store: per-user GitHub OAuth tokens, App credentials, repo
  #     bindings, the HMAC signing secret (`github_tokens`, `kv`).
  #   - Flue's conversation persistence via @flue/postgres (`flue_*`), which is
  #     what makes a conversation survive a restart or redeploy. It owns its
  #     schema; agent/db.ts only supplies the driver.
  # The prefixes do not collide and both read agent/store/pg-config.ts, so the
  # two cannot end up pointed at different databases.
  # (If provider-mode injection misbehaves, fall back to container mode — see
  # the migrate-to-astropods notes.)
  ada-db:
    provider: postgres
  # Isolated execution sandbox — where the model's commands actually run.
  #
  # This container holds NONE of the control plane's secrets: no database
  # credentials, no GitHub App client secret, no HMAC signing key, no model
  # credential. It implements Flue's `SandboxDriver` over HTTP (nine filesystem
  # and shell operations, no agent concepts), and the control plane sends a
  # user's GH_TOKEN per command so it lives only as long as the command using
  # it. A rogue `bash` the model runs therefore reaches at most one
  # conversation's checkout, in a process with nothing else worth taking.
  #
  # Every path is resolved inside the requesting instance's own directory and
  # rejected if it escapes — one conversation cannot read another's work.
  #
  # The switch is automatic: the platform injects KNOWLEDGE_SANDBOX_HOST/PORT,
  # and agent/session/remote-sandbox.ts routes execution here. Remove this block
  # and Ada falls back to Flue's in-process `local()` sandbox, which is how
  # `node agent/index.ts` and `flue run` work locally.
  #
  # /data also gives the deployment a persistent volume: per-conversation repo
  # checkouts (TTL-swept) and build caches survive a restart.
  #
  # TOOLCHAIN: the agent's commands run in THIS container, so a tool it lacks is
  # a tool Ada cannot use — it will report "not verified locally" and open a PR
  # without having run the project's checks. sandbox/Dockerfile ships `git`,
  # `gh` and `bun`; extend it with build args rather than editing the file:
  #
  #   SANDBOX_NPM_PACKAGES  default "bun@1.3.9"   e.g. "bun@1.3.9 pnpm"
  #   SANDBOX_APT_PACKAGES  default ""            e.g. "python3 golang-go"
  #
  # Build args, not runtime env: installing at boot would add a network
  # dependency and mutable tooling to the one container that runs
  # model-authored commands. If your platform cannot pass build args here,
  # change the ARG defaults at the top of sandbox/Dockerfile.
  sandbox:
    container:
      build:
        context: .
        dockerfile: sandbox/Dockerfile
      port: 3000
      volume: /data

dev:
  # Local hot-reload path (`ast dev` / `ast project`): runs the agent in a
  # container that bind-mounts the `agent/` source dir, so edits reload live via
  # node --watch. (Source lives in agent/ so it lands under the mounted path.)
  command: node --watch agent/index.ts
  interfaces:
    frontend:
      port: 8080
    # Local playground adapters for `ast dev`. `web` = built-in chat UI; add
    # `slack` to exercise the Slack channel locally. (Deploy-time Slack is
    # governed by agent.interfaces.messaging + platform Slack config, not this.)
    messaging:
      adapters: [web, slack]
