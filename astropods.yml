# yaml-language-server: $schema=https://astropods.ai/schema/package.json
spec: package/v1
name: ada-your-personal-coding-agent

agent:
  build:
    context: .
    dockerfile: Dockerfile
  interfaces:
    # Serves the built-in AG-UI client + the SSE/HTTP API publicly from the
    # container's port 80. Any AG-UI client (CopilotKit, custom) can also point
    # at {ASTRO_EXTERNAL_AGENT_URL}/sessions/... directly.
    frontend: true
    # Also deploy the platform's messaging sidecar (chat UI / Slack). The sidecar
    # runs the channel adapters, normalizes every inbound message to one shape,
    # and streams it to us over gRPC (GRPC_SERVER_ADDR). agent/messaging/adapter.ts
    # + adapter-core `serve()` handle our side, so a Slack thread becomes one
    # durable Flue agent instance (thread id == instance id). Slack itself is
    # platform-managed (its app + workspace linking + user identity live in
    # astro-server) — this agent needs NO Slack tokens. frontend + messaging
    # coexist: our UI on its hostname, Slack/web on the sidecar's routes.
    messaging: true
  # Route model calls through the Astro AI Gateway instead of a personal key.
  # Injects ASTRO_GATEWAY_URL + ASTRO_GATEWAY_API_KEY (virtual key). config/model.ts
  # maps these to the gateway's /anthropic endpoint (→ Bedrock). Opt out per-deploy
  # by setting the optional ANTHROPIC_API_KEY input below — that bypasses the
  # gateway and calls Anthropic directly.
  astro_ai_gateway: true

inputs:
  # GitHub App provisioning is web-driven. List the email addresses allowed to
  # set it up (comma-separated). An admin opens the web UI and clicks "Set up
  # GitHub App", which walks GitHub's App-Manifest flow — creating a correctly-
  # configured GitHub App (callback, permissions) in a couple clicks and storing
  # its OAuth credentials in the DB. No manual App registration, no client
  # id/secret to copy. Regular users then connect their own GitHub with
  # `/connect-github` in chat. Leave unset and any signed-in user may perform the
  # INITIAL setup (once the App is configured, provisioning locks so no one can
  # overwrite it — set this to re-enable admin re-provisioning). Emails are matched
  # (case-insensitively) against the ALB-verified identity, so setup is web-only.
  ADMIN_EMAILS:
    name: ADMIN_EMAILS
    datatype: string
    optional: true
    description: "Optional: comma-separated admin emails allowed to set up the GitHub App (matched against the verified login email). Unset = any signed-in user can do the initial setup."
    display-as: short-text
  # Optional opt-out of the Astro AI Gateway (see astro_ai_gateway above). Provide
  # your own Anthropic API key and model calls go DIRECTLY to api.anthropic.com
  # with it, bypassing the gateway/Bedrock. Leave unset to use the gateway
  # (default). In config/model.ts a set ANTHROPIC_API_KEY takes precedence over
  # the injected ASTRO_GATEWAY_* and selects the built-in `anthropic` pi-ai
  # provider instead of the custom gateway provider.
  ANTHROPIC_API_KEY:
    name: ANTHROPIC_API_KEY
    datatype: string
    secret: true
    optional: true
    description: "Optional: use this Anthropic API key directly and bypass the Astro AI Gateway"
    display-as: short-text
  # Max concurrent agent runs. A run holds a sandbox and spawns real build/test
  # commands in it (CPU+memory); both browser and messaging turns route through
  # this limiter, so LOWERING it (e.g. 1–2) is the main lever to reduce memory
  # pressure when the container can't be sized up. Default 3.
  MAX_CONCURRENT_RUNS:
    name: MAX_CONCURRENT_RUNS
    datatype: number
    optional: true
    default: "3"
    description: "Max concurrent agent runs. Lower to 1–2 to ease container memory pressure."
    display-as: short-text
  # GitHub App visibility. Default PRIVATE (single-tenant): only the account that
  # created the App can install it — right when one user/org runs their own Ada.
  # Set "true" for MULTI-TENANT: a PUBLIC App any teammate can install on THEIR
  # repos and connect via chat. Public only means "installable by others"; each
  # install is still explicit + repo-scoped, and the client secret stays secret.
  GITHUB_APP_PUBLIC:
    name: GITHUB_APP_PUBLIC
    datatype: string
    optional: true
    default: "false"
    description: "Provision the GitHub App as public (multi-tenant: installable by other users). Default false = private/single-tenant."
    display-as: select
    options: ["false", "true"]

knowledge:
  # Durable store for per-user GitHub OAuth tokens (access + refresh + expiry)
  # and other per-interaction state. Platform-managed Postgres injects
  # POSTGRES_HOST/PORT/USER/PASSWORD/DB. (If provider-mode injection misbehaves,
  # fall back to container mode — see the migrate-to-astropods notes.)
  db:
    provider: postgres
  #
  # REMOVED BY THE FLUE REWRITE: a `sandbox:` knowledge container.
  #
  # It used to build a SEPARATE, secret-less container that executed Claude Code
  # out-of-process over HTTP, on a /data volume holding per-conversation repo
  # checkouts. Flue runs the agent loop in-process with a `local()` sandbox, so
  # that service is gone (`sandbox/` and `agent/sandbox-client.ts` deleted).
  #
  # Two consequences, both deliberate and both worth knowing:
  #
  # 1. BLAST RADIUS. The model's shell now runs in the SAME container as the
  #    control plane. `local()` scrubs the env so tools can't read the DB /
  #    GitHub / HMAC credentials from it (agent/config/model.ts), but they are
  #    no longer behind a process boundary. To restore that split, swap
  #    `local()` in agents/ada.ts for a remote sandbox adapter (E2B, Daytona,
  #    Modal) — Flue's sandbox interface makes that a one-line change.
  #
  # 2. DURABILITY. A `volume:` attaches to a knowledge CONTAINER, not to the
  #    agent container, so with the sandbox gone there is no persistent volume
  #    for WORKSPACE_ROOT (/data). Repo checkouts and Flue's conversation
  #    database (agent/db.ts) therefore live on the container filesystem and do
  #    NOT survive a restart or redeploy: a Slack thread resumed after one
  #    re-clones its repo and starts a fresh conversation. Per-user GitHub
  #    tokens and repo bindings are unaffected — those are in Postgres above.
  #    Fixing this properly means a Postgres-backed Flue PersistenceAdapter
  #    (`defineSqlConversationStreamStore` in @flue/runtime/adapter).

dev:
  # Local hot-reload path (`ast dev` / `ast project`): runs the agent in a
  # container that bind-mounts the `agent/` source dir, so edits reload live via
  # node --watch. (Source lives in agent/ so it lands under the mounted path.)
  command: node --watch agent/index.ts
  interfaces:
    frontend:
      port: 8080
    # Local playground adapters for `ast dev`. `web` = built-in chat UI; add
    # `slack` to exercise the Slack channel locally. (Deploy-time Slack is
    # governed by agent.interfaces.messaging + platform Slack config, not this.)
    messaging:
      adapters: [web, slack]
